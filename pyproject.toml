[project]
name = "riverdelta"
version = "0.0.0"
description = "Heads-up poker solver."
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "open-spiel==2.0.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pybind11==3.1.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
