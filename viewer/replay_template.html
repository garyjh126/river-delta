<title>CFR Replay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a debugger. Controls stick to the top; the betting tree, call stack and breakpoints sit on the left; the current step's numbers, one row per hand, fill the right. Colours follow the strategy viewer: neutrals, with colour kept for players and actions. */
:root {
  --bg: #0f1517; --panel: #161f22; --raised: #1d282c; --line: #28373c; --fg: #e3ebe8; --muted: #8d9e9a; --faint: #55676a;
  --accent: #e2bd62; --suit-red: #e0565d; --bp: #e5484d;
  --p1: #44afaa; --p2: #8c8fe6;
  --bet: #df634d; --call: #3aa46b; --fold: #4c84c8;
  --pos: #5cc283; --neg: #f07e66; --dead: #0c1214; --empty: #131b1e;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #e9eeec; --panel: #ffffff; --raised: #f2f5f4; --line: #d0dad7; --fg: #14201d; --muted: #586965; --faint: #9eaca9;
  --accent: #9a6d12; --suit-red: #c22d36; --bp: #d1343a;
  --p1: #2a8784; --p2: #5a5cb0;
  --bet: #d8553f; --call: #2c9459; --fold: #3c72b6;
  --pos: #2e8a4d; --neg: #c24e38; --dead: #d3dbd8; --empty: #e2e8e6;
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #e9eeec; --panel: #ffffff; --raised: #f2f5f4; --line: #d0dad7; --fg: #14201d; --muted: #586965; --faint: #9eaca9;
  --accent: #9a6d12; --suit-red: #c22d36; --bp: #d1343a;
  --p1: #2a8784; --p2: #5a5cb0;
  --bet: #d8553f; --call: #2c9459; --fold: #3c72b6;
  --pos: #2e8a4d; --neg: #c24e38; --dead: #d3dbd8; --empty: #e2e8e6;
  color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.app { max-width: 1360px; margin: 0 auto; padding-block: 14px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
.app > * { min-width: 0; }
button { font: inherit; color: inherit; }
button:focus-visible, [role="button"]:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font: 600 13px/1 var(--display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }
.muted { color: var(--muted); }
code { font: 0.86em var(--mono); }

/* Top */
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px; }
.brand { font: 700 24px/1 var(--display); letter-spacing: 0.01em; }
.spot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--muted); font-size: 14px; }
.spot .dot { color: var(--faint); }
.ct { font: 600 1em/1 var(--mono); white-space: nowrap; }
.ct .red { color: var(--suit-red); }

/* Controls */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.ctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 11px; font: 600 13px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { border-color: var(--accent); color: var(--accent); }
.btn kbd { font: 500 10px/1 var(--mono); color: var(--faint); margin-left: 6px; text-transform: none; letter-spacing: 0; }
.gap { width: 10px; }
.scrub { display: flex; gap: 12px; align-items: center; }
.scrub input { flex: 1; min-width: 0; accent-color: var(--accent); }
.status { font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 14px; }
.status b { color: var(--fg); font-weight: 600; }
.who { font-weight: 600; }
.who.p0 { color: var(--p1); } .who.p1 { color: var(--p2); }

/* Panels */
.work { display: grid; grid-template-columns: minmax(0, 470px) minmax(0, 1fr); gap: 16px; align-items: start; }
.col { display: grid; gap: 14px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; background: var(--c); }

/* Tree */
#tree svg { display: block; width: 100%; height: auto; }
#tree text { font-family: var(--body); fill: var(--fg); }
#tree .edge { stroke: var(--line); stroke-width: 2; }
#tree .edge.on { stroke: var(--accent); stroke-width: 3; }
#tree .elab { font: 500 11px var(--body); fill: var(--muted); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
#tree .hit { cursor: pointer; }
#tree .hit:hover .body { filter: brightness(1.15); }
#tree .body.p0 { fill: var(--p1); } #tree .body.p1 { fill: var(--p2); }
#tree .body.end { fill: var(--raised); stroke: var(--line); }
#tree .num { font: 700 14px var(--mono); fill: var(--bg); }
#tree .tlab { font: 600 11px var(--mono); }
#tree .ring { fill: none; stroke: var(--accent); stroke-width: 3; opacity: 0; }
#tree .cur .ring { opacity: 1; }
#tree .bpdot { fill: var(--bp); stroke: var(--panel); stroke-width: 2; opacity: 0; }
#tree .bp .bpdot { opacity: 1; }

/* Call stack, breakpoints */
.stack, .bps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.stack button, .bps .row { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; border-radius: 4px; padding: 5px 8px; font-size: 14px; }
.stack button { cursor: pointer; }
.stack button:hover { background: var(--raised); }
.stack li:first-child button { background: var(--raised); box-shadow: inset 3px 0 0 var(--accent); }
.stack .fn { font: 600 13px var(--mono); min-width: 9ch; }
.stack .what { color: var(--muted); min-width: 0; }
.bps .row { justify-content: space-between; }
.bps .x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; }
.bps .x:hover { color: var(--bp); }
.bps .row::before { content: ""; flex: 0 0 9px; height: 9px; border-radius: 50%; background: var(--bp); align-self: center; }
.bps .row span { flex: 1; }
.empty-note { font-size: 13px; color: var(--muted); margin: 0; }

/* Step */
.step-head h2 { font: 700 22px/1.2 var(--display); letter-spacing: 0.02em; margin: 0 0 4px; }
.step-head p { margin: 0 0 4px; max-width: 80ch; color: var(--muted); }
.step-head .code { font: 13px/1.5 var(--mono); color: var(--fg); background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; margin: 10px 0 0; overflow-x: auto; white-space: pre; }
.qs { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin: 14px 0 10px; }
.qs button { background: var(--panel); border: 0; padding: 7px 10px; font: 600 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
.qs button + button { border-left: 1px solid var(--line); }
.qs button[aria-pressed="true"] { background: var(--raised); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.qnote { font-size: 13px; color: var(--muted); margin: 0 0 10px; max-width: 80ch; }
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 9px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { font: 600 12px/1.2 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); vertical-align: bottom; }
th code { display: block; text-transform: none; letter-spacing: 0; color: var(--faint); font-size: 11px; margin-top: 2px; }
th.act { color: var(--c); }
td { font: 13px var(--mono); }
td.hand, th.hand { text-align: left; }
td.hand .made { display: block; font: 12px var(--body); color: var(--muted); }
td.z { color: var(--faint); }
td.pos { color: var(--pos); } td.neg { color: var(--neg); }
td.pct { background-image: linear-gradient(to right, color-mix(in oklab, var(--c) 32%, transparent) var(--w), transparent var(--w)); background-repeat: no-repeat; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background-color: var(--raised); }
tbody tr.sel td { background-color: color-mix(in oklab, var(--accent) 14%, transparent); }
tbody tr.sel td.hand { box-shadow: inset 3px 0 0 var(--accent); }
td.sep, th.sep { border-left: 1px solid var(--line); }
.work-ex { margin: 12px 0 0; display: grid; gap: 4px; font: 13px/1.5 var(--mono); }
.work-ex .h { font: 600 13px var(--body); color: var(--muted); }
.work-ex div { overflow-x: auto; white-space: nowrap; }
.deal { margin-top: 18px; }
.deal td, .deal th { padding: 4px 6px; text-align: center; }
.deal td.c { font-weight: 600; }
.deal td.w { color: var(--pos); } .deal td.l { color: var(--neg); } .deal td.t { color: var(--muted); }
.deal td.x { background: var(--dead); color: var(--faint); background-image: repeating-linear-gradient(135deg, transparent 0 6px, var(--empty) 6px 7px); }
.deal th.hand, .deal td.hand { text-align: left; }
.deal td.val { text-align: right; }
.foot { font-size: 13px; color: var(--muted); max-width: 90ch; margin: 0; }

@media (max-width: 1000px) { .work { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { .bar { position: static; } .btn kbd { display: none; } .btn { padding: 8px 9px; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand">CFR replay</div>
    <div class="spot" id="spot"></div>
  </header>

  <div class="bar">
    <div class="ctl" role="toolbar" aria-label="Step through the run">
      <button class="btn" id="b-restart" title="Back to the first step (Home)">Restart</button>
      <button class="btn" id="b-rcont" title="Back to the previous breakpoint (Shift+C)">◀◀ Breakpoint</button>
      <button class="btn" id="b-back" title="One step back (B or ←)">◀ Back<kbd>B</kbd></button>
      <button class="btn primary" id="b-step" title="One step forward (S or →)">Step ▶<kbd>S</kbd></button>
      <button class="btn" id="b-over" title="Skip past everything below this node (N)">Step over<kbd>N</kbd></button>
      <button class="btn" id="b-out" title="Run to the end of the current node (F)">Step out<kbd>F</kbd></button>
      <button class="btn" id="b-cont" title="Run to the next breakpoint (C)">Continue ▶▶<kbd>C</kbd></button>
      <span class="gap"></span>
      <button class="btn" id="b-prev-it" title="Start of this iteration, or of the one before">◀ Iteration</button>
      <button class="btn" id="b-next-it" title="Start of the next iteration">Iteration ▶</button>
    </div>
    <div class="scrub"><input type="range" id="scrub" min="0" value="0" aria-label="Step"><span class="mono muted" id="count"></span></div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>

  <div class="work">
    <div class="col">
      <section class="panel">
        <h2 class="label">Betting tree</h2>
        <div id="tree"></div>
        <div class="legend"><span style="--c: var(--p1)">P1 decides</span><span style="--c: var(--p2)">P2 decides</span><span style="--c: var(--bp)">breakpoint: click a node to set one</span></div>
      </section>
      <section class="panel">
        <h2 class="label">Call stack</h2>
        <ol class="stack" id="stack"></ol>
      </section>
      <section class="panel">
        <h2 class="label">Breakpoints</h2>
        <ul class="bps" id="bps"></ul>
      </section>
    </div>
    <div class="col">
      <section class="panel" id="step"></section>
      <p class="foot" id="foot"></p>
    </div>
  </div>
</div>

<script>
const DATA = /*DATA*/null;
const D = DATA, S = D.steps, N = S.length, n = D.hands.length;
const PLAYERS = ["P1", "P2"];
const SUIT = { c: "♣", d: "♦", h: "♥", s: "♠" };
const ACTION_COLOR = { fold: "var(--fold)", check: "var(--call)", call: "var(--call)", bet: "var(--bet)", raise: "var(--bet)", allin: "var(--bet)" };
const METHOD = { "cfr+": "CFR+", dcfr: "discounted CFR" }[D.method];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

const card = c => `<span class="ct"><span class="${"dh".includes(c[1]) ? "red" : ""}">${c[0]}${SUIT[c[1]]}</span></span>`;
const hand = h => card(h.slice(0, 2)) + card(h.slice(2));
const who = p => `<span class="who p${p}">${PLAYERS[p]}</span>`;
const nodeName = i => "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳"[i] ?? `#${i + 1}`;

// The way to each node: its parent and the action from there.
const parent = D.nodes.map(() => null);
D.nodes.forEach((node, i) => node.children.forEach((c, a) => { if (c.node >= 0) parent[c.node] = { node: i, a }; }));
function line(i) {
  const words = [];
  for (let at = parent[i]; at; at = parent[at.node]) words.unshift(D.nodes[at.node].actions[at.a]);
  return words.length ? words.join(", ") : "start of the hand";
}
const where = i => parent[i] ? `after ${line(i)}` : "at the start of the hand";

// For every step: the open frames (the visit steps of the nodes being walked, root first), and
// for every visit, the update that closes it. Also each step's last regrets at its node before it.
const frames = [], closes = {}, regretBefore = [];
{
  const stack = [], lastRegret = {};
  S.forEach((s, i) => {
    if (s.kind === "visit") stack.push(i);
    frames[i] = stack.slice();
    regretBefore[i] = lastRegret[s.node] ?? null;
    if (s.kind === "update") {
      closes[stack.pop()] = i;
      if (s.regret.length) lastRegret[s.node] = i;
    }
  });
}

const state = { i: 0, q: null, h: 0, bps: new Set() };
const bpKey = s => s.kind === "end" ? `t${s.node}.${s.a}` : `n${s.node}`;
const hits = i => (S[i].kind === "visit" || S[i].kind === "end") && state.bps.has(bpKey(S[i]));

// ---------- numbers ----------
const fmt = x => Math.abs(x) < 5e-7 ? "0" : x.toFixed(3);
const signed = x => Math.abs(x) < 5e-7 ? "0" : (x > 0 ? "+" : "−") + Math.abs(x).toFixed(3);
const pct = x => (100 * x).toFixed(1) + "%";
const row = (flat, a) => flat.slice(a * n, (a + 1) * n);
function normalise(flat, actions) {
  const out = flat.slice();
  for (let h = 0; h < n; h++) {
    let total = 0;
    for (let a = 0; a < actions; a++) total += flat[a * n + h];
    for (let a = 0; a < actions; a++) out[a * n + h] = total > 0 ? flat[a * n + h] / total : 1 / actions;
  }
  return out;
}
const zeros = k => new Array(k).fill(0);

// ---------- tree ----------
const items = {}; // id -> {x, y, el}
function buildTree() {
  let leaves = 0, depthMax = 0;
  const lay = (i, depth) => {
    depthMax = Math.max(depthMax, depth);
    const kids = D.nodes[i].children.map((c, a) => c.node >= 0 ? lay(c.node, depth + 1)
      : (depthMax = Math.max(depthMax, depth + 1), { id: `t${i}.${a}`, x: leaves++, depth: depth + 1, end: c, from: i, a }));
    const item = { id: `n${i}`, node: i, depth, kids, x: (kids[0].x + kids[kids.length - 1].x) / 2 };
    kids.forEach((k, a) => { k.parent = item; k.a = a; });
    return item;
  };
  const root = lay(0, 0);
  const GX = 50, GY = 74, PAD = 30;
  const X = x => PAD + x * GX, Y = d => 26 + d * GY;
  const W = PAD * 2 + (leaves - 1) * GX, H = Y(depthMax) + 30;
  let edges = "", nodes = "";
  const walk = item => {
    items[item.id] = { x: X(item.x), y: Y(item.depth) };
    for (const k of item.kids) {
      const x1 = X(item.x), y1 = Y(item.depth), x2 = X(k.x), y2 = Y(k.depth);
      const act = D.nodes[item.node].actions[k.a];
      edges += `<line class="edge" data-to="${k.id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
      edges += `<text class="elab" x="${(x1 + x2) / 2 + (x2 >= x1 ? 4 : -4)}" y="${(y1 + y2) / 2}" text-anchor="${x2 >= x1 ? "start" : "end"}">${act}</text>`;
      if (k.end) {
        const c = k.end, x = x2, y = y2;
        const lab = c.folder < 0 ? `±${c.contrib[0]}` : `${PLAYERS[1 - c.folder]} +${c.contrib[c.folder]}`;
        const what = c.folder < 0 ? `showdown after ${line(k.from)}, ${act}: ${c.contrib[0]} chips each` : `${PLAYERS[c.folder]} folds after ${line(k.from)}`;
        nodes += `<g class="hit" id="g-${k.id}" data-bp="${k.id}" role="button" tabindex="0" aria-label="Breakpoint at ${esc(what)}"><title>${esc(what)}. Click for a breakpoint.</title>
          <rect class="ring" x="${x - 24}" y="${y - 14}" width="48" height="28" rx="7"/>
          <rect class="body end" x="${x - 21}" y="${y - 11}" width="42" height="22" rx="5"/>
          <text class="tlab" x="${x}" y="${y + 4}" text-anchor="middle">${lab}</text>
          <circle class="bpdot" cx="${x - 20}" cy="${y - 11}" r="5"/></g>`;
        items[k.id] = { x, y };
      } else walk(k);
    }
    const x = X(item.x), y = Y(item.depth), node = D.nodes[item.node];
    const what = `${nodeName(item.node)} ${PLAYERS[node.player]} to act ${where(item.node)}`;
    nodes += `<g class="hit" id="g-${item.id}" data-bp="${item.id}" role="button" tabindex="0" aria-label="Breakpoint at ${esc(what)}"><title>${esc(what)}. Click for a breakpoint.</title>
      <circle class="ring" cx="${x}" cy="${y}" r="19"/>
      <circle class="body p${node.player}" cx="${x}" cy="${y}" r="15"/>
      <text class="num" x="${x}" y="${y + 5}" text-anchor="middle">${item.node + 1}</text>
      <circle class="bpdot" cx="${x - 12}" cy="${y - 12}" r="5"/></g>`;
  };
  walk(root);
  $("tree").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Betting tree">${edges}${nodes}</svg>`;
  $("tree").querySelectorAll("[data-bp]").forEach(g => {
    const toggle = () => { const k = g.dataset.bp; state.bps.has(k) ? state.bps.delete(k) : state.bps.add(k); render(); };
    g.addEventListener("click", toggle);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
  });
}

function bpName(k) {
  if (k[0] === "n") { const i = +k.slice(1); return `${nodeName(i)} ${PLAYERS[D.nodes[i].player]} to act ${where(i)}`; }
  const [i, a] = k.slice(1).split(".").map(Number), c = D.nodes[i].children[a];
  return c.folder < 0 ? `Showdown after ${line(i)}, ${D.nodes[i].actions[a]}` : `${PLAYERS[c.folder]} folds after ${line(i)}`;
}

// ---------- step panel ----------
const QUANTITIES = {
  strategy: { label: "Strategy", code: "sigma", pct: true,
    note: "The current strategy: regret matching on the regrets so far (CFR+ keeps them at zero or above). An action with no positive regret isn't played; with none at all, every action is equally likely." },
  values: { label: "Action values", code: "values",
    note: "Each action's counterfactual value for the updating player: what the hand wins after taking it, summed over the opponent's hands weighted by their reach." },
  instant: { label: "Regret now", code: "values − v",
    note: "This iteration's regret: an action's value minus the strategy's value at the node. Positive means the action did better than the current mix." },
  before: { label: "Regret before", code: "regret (old)",
    note: "The regrets before this update, from the last time this player's walk left the node." },
  regret: { label: "Regret after", code: "regret",
    note: D.method === "cfr+" ? "Regret before plus regret now, floored at zero (CFR+). The next iteration's strategy plays each action in proportion to these."
      : "Regret before plus regret now, then discounted: positive regrets × t^1.5 / (t^1.5 + 1), negative ones × ½ (discounted CFR)." },
  sum: { label: "Strategy sum", code: "strategy_sum",
    note: D.method === "cfr+" ? "Running sum of the strategy, weighted by the player's own reach and by the iteration number t (CFR+)." : "Running sum of the strategy, weighted by the player's own reach and by t² (discounted CFR)." },
  average: { label: "Average strategy", code: "average()", pct: true,
    note: "The strategy sum, normalised per hand: this is what converges to equilibrium, not the current strategy." },
};

function stepQuantities(s) {
  if (s.kind === "visit") return ["strategy"];
  if (s.kind === "end") return [];
  return s.regret.length ? ["strategy", "values", "instant", "before", "regret", "sum", "average"] : ["strategy", "values"];
}
function defaultQ(s) { return s.kind === "update" ? (s.regret.length ? "regret" : "values") : "strategy"; }

function quantity(q, s, i) {
  const k = D.nodes[s.node].actions.length;
  if (q === "strategy") return s.strategy;
  if (q === "values") return s.values;
  if (q === "instant") return s.values.map((x, j) => x - s.value[j % n]);
  if (q === "before") return regretBefore[i] === null ? zeros(k * n) : S[regretBefore[i]].regret;
  if (q === "regret") return s.regret;
  if (q === "sum") return s.sum;
  if (q === "average") return normalise(s.sum, k);
}

function headline(s) {
  const node = D.nodes[s.node], p = s.p, o = 1 - p;
  const at = `${nodeName(s.node)}: ${who(node.player)} to act ${esc(where(s.node))}`;
  const pass = `On ${who(p)}'s walk, ${who(p)}'s regrets are the ones that change.`;
  if (s.kind === "visit") {
    const own = node.player === p;
    return { title: `Reach ${at}`,
      text: `${pass} ${own ? `This is ${who(p)}'s own node: each action is tried in turn, and its regrets update when the walk leaves.`
        : `This is ${who(o)}'s node: ${who(o)}'s strategy scales ${who(o)}'s reach down each action, and nothing here updates.`}`,
      code: "sigma = current(node)   // Solver::cfr, engine/cpp/cfr.cpp" };
  }
  if (s.kind === "end") {
    const c = node.children[s.a], act = node.actions[s.a];
    if (c.folder < 0) return { title: `Showdown after ${esc(line(s.node))}, ${act}`,
      text: `${c.contrib[0]} chips each in the pot (blinds included): the better hand wins the other's ${c.contrib[0]}. ${who(p)}'s value for each hand sums over ${who(o)}'s hands it can meet, weighted by ${who(o)}'s reach.`,
      code: `values = ${c.contrib[0]} × (showdown · opp)   // Solver::terminal: showdown[h][j] is +1, −1 or 0` };
    const f = c.folder, sign = f === p ? "−" : "+";
    return { title: `${PLAYERS[f]} folds at ${nodeName(s.node)}`,
      text: `${who(f)} loses the ${c.contrib[f]} chips ${who(f)} put in (blinds included), and ${who(1 - f)} wins them. Card removal still counts: ${who(p)}'s value sums only over ${who(o)}'s hands that share no card.`,
      code: `values = ${sign}${c.contrib[f]} × (compatible · opp)   // Solver::terminal` };
  }
  if (s.regret.length) return { title: `Leave ${at}`,
    text: `Back up at ${who(p)}'s own node with every action's value: the node's value is the strategy's mix of them, and each action's regret moves by how much better it did.`,
    code: (D.method === "cfr+" ? "regret[k] = max(regret[k] + values[k] − v[h], 0)" : "r = regret[k] + values[k] − v[h];  regret[k] = r × (r ≥ 0 ? t^1.5 / (t^1.5 + 1) : 0.5)")
      + `\nstrategy_sum[k] += ${D.method === "cfr+" ? "t" : "t²"} × own[h] × sigma[k]   // Solver::cfr` };
  return { title: `Leave ${at}`,
    text: `Back up at ${who(1 - p)}'s node: ${who(p)}'s value here is the plain sum over ${who(1 - p)}'s actions, because ${who(1 - p)}'s strategy is already in the reach passed down each one.`,
    code: "total[h] += v[h]   // Solver::cfr, the opponent's node" };
}

function workedExample(s, i, q) {
  const node = D.nodes[s.node], h = state.h, k = node.actions.length, t = s.t;
  const H = `<span class="ct">${hand(D.hands[h])}</span>`;
  if (s.kind === "visit" || q === "strategy") {
    const before = regretBefore[i] === null ? zeros(k * n) : S[regretBefore[i]].regret;
    const pos = node.actions.map((_, a) => Math.max(before[a * n + h], 0)), total = pos.reduce((x, y) => x + y, 0);
    return `<div class="h">Regret matching for ${H}</div><div>positive regrets ${node.actions.map((a, j) => `${a} ${fmt(pos[j])}`).join(", ")}`
      + (total > 0 ? ` → strategy ${node.actions.map((a, j) => `${a} ${pct(pos[j] / total)}`).join(", ")}</div>` : ` → none positive, so every action ${pct(1 / k)}</div>`);
  }
  if (!s.regret.length) {
    return `<div class="h">${H}: value here = sum over ${PLAYERS[node.player]}'s actions</div><div>${node.actions.map((a, j) => fmt(s.values[j * n + h])).join(" + ")} = ${fmt(s.value[h])}</div>`;
  }
  const before = quantity("before", s, i), prevSum = regretBefore[i] === null ? zeros(k * n) : S[regretBefore[i]].sum;
  const lines = [`<div class="h">${H}: v = ${node.actions.map((a, j) => `${pct(s.strategy[j * n + h])} × ${fmt(s.values[j * n + h])}`).join(" + ")} = ${fmt(s.value[h])}</div>`];
  if (q === "sum" || q === "average") {
    const w = D.method === "cfr+" ? `${t}` : `${t}²`;
    node.actions.forEach((a, j) => lines.push(`<div>${a}: ${fmt(prevSum[j * n + h])} + ${w} × ${fmt(s.own[h])} × ${pct(s.strategy[j * n + h])} = ${fmt(s.sum[j * n + h])}</div>`));
  } else {
    node.actions.forEach((a, j) => {
      const m = j * n + h, r = before[m] + s.values[m] - s.value[h];
      const tail = D.method === "cfr+" ? `→ max(${fmt(r)}, 0) = ${fmt(s.regret[m])}` : `→ × ${r >= 0 ? `${(t ** 1.5 / (t ** 1.5 + 1)).toFixed(3)}` : "0.5"} = ${fmt(s.regret[m])}`;
      lines.push(`<div>${a}: ${fmt(before[m])} + (${fmt(s.values[m])} − ${fmt(s.value[h])}) = ${fmt(r)} ${tail}</div>`);
    });
  }
  return lines.join("");
}

function dealTable(s) {
  const c = D.nodes[s.node].children[s.a], p = s.p, o = 1 - p;
  const stake = c.folder < 0 ? c.contrib[0] : (c.folder === p ? -1 : 1) * c.contrib[c.folder];
  let head = `<tr><th class="hand">${PLAYERS[p]} holds · ${PLAYERS[o]} holds →</th>${D.hands.map(h => `<th>${hand(h)}</th>`).join("")}<th>Value</th></tr>`;
  head += `<tr><th class="hand">${PLAYERS[o]}'s reach <code>opp</code></th>${s.opp.map(x => `<th class="mono">${fmt(x)}</th>`).join("")}<th></th></tr>`;
  const body = D.hands.map((h, i) => {
    const cells = D.hands.map((g, j) => {
      const clash = h.slice(0, 2) === g.slice(0, 2) || h.slice(0, 2) === g.slice(2) || h.slice(2) === g.slice(0, 2) || h.slice(2) === g.slice(2);
      if (clash) return `<td class="x" title="${h} and ${g} share a card: this deal can't happen">·</td>`;
      const r = c.folder < 0 ? D.showdown[i][j] : 1, sign = Math.sign(stake * r);
      const ch = c.folder < 0 ? (r > 0 ? "W" : r < 0 ? "L" : "T") : (stake > 0 ? "+" : "−");
      return `<td class="c ${sign > 0 ? "w" : sign < 0 ? "l" : "t"}" title="${h} against ${g}: ${signed(stake * r)} chips × reach ${fmt(s.opp[j])}">${ch}</td>`;
    }).join("");
    return `<tr class="${i === state.h ? "sel" : ""}" data-h="${i}"><td class="hand">${hand(h)}</td>${cells}<td class="val ${s.values[i] > 0 ? "pos" : s.values[i] < 0 ? "neg" : "z"}">${signed(s.values[i])}</td></tr>`;
  }).join("");
  return `<div class="deal"><h3 class="label">Every deal at this end of the hand</h3>
    <p class="qnote">One row per ${PLAYERS[p]} hand, one column per ${PLAYERS[o]} hand. ${c.folder < 0 ? "W, L, T: who wins the showdown" : "+ or −: who gets the pot"}; hatched pairs share a card. A row's value is ${Math.abs(stake)} × the sum of its ${c.folder < 0 ? "+1 and −1" : "deals"}, each weighted by ${PLAYERS[o]}'s reach above it.</p>
    <div class="tw"><table><thead>${head}</thead><tbody>${body}</tbody></table></div></div>`;
}

function renderStep() {
  const i = state.i, s = S[i], node = D.nodes[s.node], k = node.actions.length;
  const head = headline(s), qs = stepQuantities(s);
  const q = qs.includes(state.q) ? state.q : defaultQ(s);
  let html = `<div class="step-head"><h2>${head.title}</h2><p>${head.text}</p><div class="code">${esc(head.code)}</div></div>`;
  if (qs.length > 1) html += `<div class="qs" role="group" aria-label="Which numbers">${qs.map(x => `<button data-q="${x}" aria-pressed="${x === q}">${QUANTITIES[x].label}</button>`).join("")}</div>`;
  else html += `<div style="height:14px"></div>`;
  if (qs.length) html += `<p class="qnote">${QUANTITIES[q].note}</p>`;
  const P = s.p, O = 1 - s.p;
  html += `<p class="qnote">One row per hand. Reach: how likely ${PLAYERS[P]}, or ${PLAYERS[O]}, is to play to this point when holding that hand. Values are ${PLAYERS[P]}'s, holding it.</p>`;
  let cols = `<th class="hand">Hand</th><th>${PLAYERS[P]}'s reach<code>own</code></th><th>${PLAYERS[O]}'s reach<code>opp</code></th>`;
  if (s.kind === "end") cols += `<th class="sep">Value<code>values</code></th>`;
  if (s.kind === "update") cols += `<th class="sep">Node value<code>v</code></th>`;
  let flat = null;
  if (qs.length) {
    flat = quantity(q, s, i);
    cols += node.actions.map((a, j) => `<th class="act${j === 0 ? " sep" : ""}" style="--c:${ACTION_COLOR[a]}">${a}${j === 0 ? `<code>${esc(QUANTITIES[q].code)}${q === "strategy" && node.player !== P ? ` (${PLAYERS[O]}'s)` : ""}</code>` : "<code>&nbsp;</code>"}</th>`).join("");
  }
  const rows = D.hands.map((h, r) => {
    let tds = `<td class="hand">${hand(h)}<span class="made">${esc(D.made[r])}</span></td><td class="${s.own[r] ? "" : "z"}">${fmt(s.own[r])}</td><td class="${s.opp[r] ? "" : "z"}">${fmt(s.opp[r])}</td>`;
    const num = x => `<td class="sep ${x > 5e-7 ? "pos" : x < -5e-7 ? "neg" : "z"}">${signed(x)}</td>`;
    if (s.kind === "end") tds += num(s.values[r]);
    if (s.kind === "update") tds += num(s.value[r]);
    if (flat) tds += node.actions.map((a, j) => {
      const x = flat[j * n + r], sep = j === 0 ? " sep" : "";
      if (QUANTITIES[q].pct) return `<td class="pct${sep}" style="--c:${ACTION_COLOR[a]};--w:${(100 * x).toFixed(1)}%">${pct(x)}</td>`;
      if (q === "sum") return `<td class="${x ? "" : "z"}${sep}">${fmt(x)}</td>`;
      return `<td class="${x > 5e-7 ? "pos" : x < -5e-7 ? "neg" : "z"}${sep}">${signed(x)}</td>`;
    }).join("");
    return `<tr class="${r === state.h ? "sel" : ""}" data-h="${r}">${tds}</tr>`;
  }).join("");
  html += `<div class="tw"><table><thead><tr>${cols}</tr></thead><tbody>${rows}</tbody></table></div>`;
  if (s.kind !== "end") html += `<div class="work-ex">${workedExample(s, i, q)}</div>`;
  else html += dealTable(s);
  $("step").innerHTML = html;
  $("step").querySelectorAll("[data-q]").forEach(b => b.addEventListener("click", () => { state.q = b.dataset.q; render(); }));
  $("step").querySelectorAll("tr[data-h]").forEach(tr => tr.addEventListener("click", () => { state.h = +tr.dataset.h; render(); }));
}

function renderTree() {
  const s = S[state.i];
  const cur = s.kind === "end" ? `t${s.node}.${s.a}` : `n${s.node}`;
  const path = new Set(frames[state.i].map(v => `n${S[v].node}`));
  if (s.kind === "end") path.add(cur);
  $("tree").querySelectorAll("g[data-bp]").forEach(g => {
    g.classList.toggle("cur", g.dataset.bp === cur);
    g.classList.toggle("bp", state.bps.has(g.dataset.bp));
  });
  $("tree").querySelectorAll(".edge").forEach(e => e.classList.toggle("on", path.has(e.dataset.to)));
}

function renderStack() {
  const s = S[state.i], fs = frames[state.i];
  const items = [`<li><button data-go="${S.findIndex(x => x.t === s.t && x.p === s.p)}"><span class="fn">iterate()</span><span class="what">iteration ${s.t}, ${PLAYERS[s.p]}'s walk</span></button></li>`];
  items.push(...fs.map(v => {
    const node = D.nodes[S[v].node];
    return `<li><button data-go="${v}"><span class="fn">cfr(${nodeName(S[v].node)})</span><span class="what">${PLAYERS[node.player]} to act ${esc(where(S[v].node))}</span></button></li>`;
  }));
  if (s.kind === "end") {
    const c = D.nodes[s.node].children[s.a];
    items.push(`<li><button data-go="${state.i}"><span class="fn">terminal()</span><span class="what">${c.folder < 0 ? "showdown" : `${PLAYERS[c.folder]} folds`} · ${esc(line(s.node))}, ${D.nodes[s.node].actions[s.a]}</span></button></li>`);
  }
  $("stack").innerHTML = items.reverse().join("");
  $("stack").querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(+b.dataset.go)));
}

function renderBps() {
  const list = [...state.bps];
  $("bps").innerHTML = list.length ? list.map(k => `<li class="row"><span>${esc(bpName(k))}</span><button class="x" data-k="${k}" aria-label="Remove breakpoint" title="Remove">×</button></li>`).join("")
    : `<li><p class="empty-note">None yet. Click a node in the tree: Continue then stops whenever a walk reaches it.</p></li>`;
  $("bps").querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", () => { state.bps.delete(b.dataset.k); render(); }));
}

function render() {
  const s = S[state.i];
  $("scrub").value = state.i;
  $("count").textContent = `step ${state.i + 1} of ${N}`;
  $("status").innerHTML = `<span>Iteration <b>${s.t}</b> of ${D.iterations}</span><span>${who(s.p)}'s walk: ${who(s.p)}'s regrets update</span>`
    + `<span>Exploitability after iteration ${s.t}: <b class="mono">${D.exploitability[s.t - 1].toFixed(5)}</b> chips per hand</span>`;
  $("b-back").disabled = $("b-restart").disabled = state.i === 0;
  $("b-step").disabled = $("b-over").disabled = $("b-out").disabled = $("b-cont").disabled = $("b-next-it").disabled = state.i === N - 1;
  $("b-rcont").disabled = state.i === 0;
  renderTree(); renderStack(); renderBps(); renderStep();
  try { history.replaceState(null, "", `#step=${state.i + 1}`); } catch (e) {}
}

// ---------- moving ----------
function go(i) { state.i = Math.max(0, Math.min(N - 1, i)); render(); }
const step = () => go(state.i + 1);
const back = () => go(state.i - 1);
function over() { const s = S[state.i]; go(s.kind === "visit" ? closes[state.i] : state.i + 1); }
function out() {
  const s = S[state.i], fs = frames[state.i];
  if (s.kind !== "update") return go(closes[fs[fs.length - 1]]);
  go(fs.length > 1 ? closes[fs[fs.length - 2]] : state.i + 1);
}
function cont() { for (let j = state.i + 1; j < N; j++) if (hits(j)) return go(j); go(N - 1); }
function rcont() { for (let j = state.i - 1; j >= 0; j--) if (hits(j)) return go(j); go(0); }
function nextIt() { const t = S[state.i].t, j = S.findIndex(x => x.t === t + 1); go(j < 0 ? N - 1 : j); }
function prevIt() {
  const t = S[state.i].t, start = S.findIndex(x => x.t === t);
  go(state.i > start ? start : S.findIndex(x => x.t === t - 1));
}

function init() {
  const B = D.board.map(card).join(" ");
  $("spot").innerHTML = [D.game, `board ${B}`, D.rules, `${METHOD}, ${D.iterations} iterations`, "recorded from the C++ engine"].join(' <span class="dot">·</span> ');
  $("foot").innerHTML = `Recorded by <code>Solver::trace</code> in the C++ engine (<code>viewer/replay.py</code>): every step of every walk, rounded to 6 significant digits. `
    + `Values are counterfactual values: summed over the opponent's hands, weighted by how likely the opponent's choices are to reach here, with the updating player's own choices counted as 1 and the chance of the deal left out, as in the engine. `
    + `Chip amounts include the blinds. Each iteration walks the tree twice, P1's walk then P2's, and only the walking player's regrets change. Numbering ①–⑥ follows the Mini Hold'em Tree page.`;
  $("scrub").max = N - 1;
  buildTree();
  $("scrub").addEventListener("input", e => go(+e.target.value));
  $("b-restart").addEventListener("click", () => go(0));
  $("b-back").addEventListener("click", back);
  $("b-step").addEventListener("click", step);
  $("b-over").addEventListener("click", over);
  $("b-out").addEventListener("click", out);
  $("b-cont").addEventListener("click", cont);
  $("b-rcont").addEventListener("click", rcont);
  $("b-next-it").addEventListener("click", nextIt);
  $("b-prev-it").addEventListener("click", prevIt);
  document.addEventListener("keydown", e => {
    if (e.target.closest?.("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    const key = e.key.toLowerCase();
    const act = { arrowright: step, s: step, arrowleft: back, b: back, n: over, f: out, home: () => go(0) }[key]
      ?? (key === "c" ? (e.shiftKey ? rcont : cont) : null);
    if (act) { e.preventDefault(); act(); }
  });
  const m = location.hash.match(/step=(\d+)/);
  state.i = m ? Math.max(0, Math.min(N - 1, +m[1] - 1)) : 0;
  render();
}
init();
</script>
